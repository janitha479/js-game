<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quiz Game</title>
    
    <!-- Preload critical assets for faster loading -->
    <link rel="preload" href="assets/videos/idle.mp4" as="video" type="video/mp4">
    <link rel="preload" href="assets/images/bg.png" as="image">
    <link rel="preload" href="assets/images/display1.png" as="image">
    
    <!-- Prefetch other videos so they're ready -->
    <link rel="prefetch" href="assets/videos/success.mp4" as="video">
    <link rel="prefetch" href="assets/videos/failure.mp4" as="video">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Initial Loading Screen (shown while caching assets) -->
    <div id="initial-loader" class="initial-loader">
        <div class="loader-content">
            <div class="loader">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="loader-text">Loading Game Assets...</div>
            <div class="loader-progress" id="loader-progress">0%</div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen active">
        <!-- Idle Video Layer -->
        <div id="idle-layer" class="layer">
            <video id="idle-video" loop muted playsinline>
                <source src="assets/videos/idle.mp4" type="video/mp4">
            </video>
            <div class="touch-prompt"></div>
        </div>

        <!-- Interactive Layer (Image + Questions) -->
        <div id="interactive-layer" class="layer hidden">
            <div class="game-container">
                <!-- Question Title at Top -->
                <div class="title-section">
                    <h2 id="display-title"></h2>
                </div>
                
                <!-- Answer Buttons Grid at Top (2x3) -->
                <div class="answers-section">
                    <div class="answer-buttons" id="answer-buttons">
                        <!-- 6 answer buttons will be generated here -->
                    </div>
                </div>
                
                <!-- Main Display Image in Center -->
                <div class="main-image-section">
                    <img id="display-image" src="" alt="Display Image">
                </div>
                
                <!-- Select Answers Label -->
                <div class="select-label">SELECT 3 ANSWERS</div>

                <!-- Selected Answers at Bottom -->
                <div class="selected-answers-section">
                    <div class="selected-label"></div>
                    <div class="selected-slots">
                        <div class="answer-slot" data-slot="0"></div>
                        <div class="answer-slot" data-slot="1"></div>
                        <div class="answer-slot" data-slot="2"></div>
                    </div>
                </div>
            </div>
            
            <!-- Transition Image Overlay -->
            <div id="transition-overlay" class="transition-overlay hidden">
                <img id="transition-image" src="" alt="Transition">
            </div>
            
            <!-- Waiting Overlay -->
            <div id="waiting-overlay" class="waiting-overlay">
                <img class="waiting-image" src="assets/images/bg4.png" alt="Loading">
                <div class="loader">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>
                <div class="waiting-text"></div>
            </div>
        </div>

        <!-- Result Video Layer -->
        <div id="result-layer" class="layer hidden">
            <video id="result-video" playsinline>
                <source id="result-video-source" src="" type="video/mp4">
            </video>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
